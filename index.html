    @keyframes orbit-rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes counter-rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
    
    .orbit-ring {
      position: relative;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(242, 210, 139, 0.04);
      animation: orbit-rotation 45s linear infinite;
    }
    .orbit-wrapper { position: absolute; width: 60px; height: 60px; transform: translate(-50%, -50%); }
    .orbit-item { position: relative; width: 100%; height: 100%; animation: counter-rotation 45s linear infinite; }
    .orbit-link {

      border: 1px solid rgba(255,255,255,0.12);
      transition: all 0.3s ease; align-items: center; justify-content: center;
      overflow: hidden; text-decoration: none; background: rgba(10,10,14,0.7);
    }
    .orbit-link:hover { border-color: #F2D28B; box-shadow: 0 0 20px rgba(242, 210, 139, 0.45); transform: scale(1.1); }

      else if (scene.isTheUnion) {
        rightColumnContent = `
          <div id="orbit-container-target" class="hidden md:flex relative w-[360px] h-[360px] items-center justify-center scale-95 mt-4 md:mt-0 pointer-events-auto">
          </div>
        `;
      }

      const tagType = scene.isProduct ? "a" : "div";
      const hrefAttr = scene.isProduct ? `href="${scene.url}" target="_blank" rel="noopener noreferrer"` : "";
      const cursorClass = scene.isProduct ? "cursor-pointer hover:border-[#F2D28B]/40 transition-all duration-300" : "";

      let cardSizeClass = (scene.isIntro || scene.isTheUnion) ? "max-w-5xl p-6 md:p-12 gap-10 lg:gap-16" : "max-w-3xl p-6 md:p-10";

      cardWrapper.innerHTML = `
        <${tagType} ${hrefAttr} class="scene-card w-full ${cardSizeClass} bg-[#07070a]/94 backdrop-blur-2xl border border-white/10 rounded-2xl md:rounded-[2.5rem] shadow-[0_30px_90px_rgba(0,0,0,0.9)] preserve-3d opacity-0 pointer-events-none flex flex-col ${flexDirClass} gap-6 md:gap-10 items-center justify-between ${cursorClass}">
          <div class="flex-1 text-left w-full max-w-xl">
            <div class="flex items-center gap-3.5 mb-3">
              <img src="public/loghi/${scene.logo}" alt="${scene.title}" class="w-8 h-8 object-contain rounded-lg bg-black/50 p-1 border border-white/10" onerror="this.style.display='none'">
              <div>
                <span class="text-[9px] uppercase tracking-[0.35em] text-[#F2D28B] block font-mono font-semibold">${scene.chapter}</span>
                <h2 class="font-serif text-2xl md:text-3xl text-white tracking-wide leading-tight">${scene.title}</h2>
              </div>
            </div>
            <p class="text-sm tracking-wide text-neutral-300 leading-relaxed font-light">${scene.subtitle}</p>
            ${editorialBody}
            ${introButton}
            ${siteLinkButton}
            ${contactForm}
          </div>
          ${rightColumnContent}
        </${tagType}>
      `;

      overlayContainer.appendChild(cardWrapper);
    });

    function handleVCardClick() {
      const link = document.createElement("a");
      link.href = "public/contact.vcf";
      link.download = "Riccardo_Modena_RMStudio.vcf";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function handleContactSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const button = form.querySelector("button[type='submit']");
      button.innerText = "Invio...";
      button.disabled = true;

      try {
        const res = await fetch("https://api.web3forms.com/submit", { method: "POST", body: formData });
        if (res.ok) {
          alert("Richiesta inviata! Ti risponderò entro poche ore.");
          form.reset();
        } else {
          alert("Errore durante l'invio. Riprova.");
        }
      } catch {
        alert("Errore di connessione.");
      } finally {
        button.innerText = "Invia Richiesta Diretta";
        button.disabled = false;
      }
    }

    // ─── TRANSIZIONI 3D PROPS ───
    function getSceneProps(index) {
      switch (index) {
        case 0:
          return {
            init: { autoAlpha: 0, scale: 0.8, z: -300, pointerEvents: "none" },
            mid: { autoAlpha: 1, scale: 1, z: 0, pointerEvents: "auto" },
            exit: { autoAlpha: 0, scale: 1.05, z: 80, pointerEvents: "none" }
          };
        case 1:
          return {
            init: { autoAlpha: 0, rotateY: 70, x: 200, pointerEvents: "none" },
            mid: { autoAlpha: 1, rotateY: 0, x: 0, pointerEvents: "auto" },
            exit: { autoAlpha: 0, rotateY: -70, x: -200, pointerEvents: "none" }
          };
        case 2:
          return {
            init: { autoAlpha: 0, y: -200, rotateX: 30, pointerEvents: "none" },
            mid: { autoAlpha: 1, y: 0, rotateX: 0, pointerEvents: "auto" },
            exit: { autoAlpha: 0, y: 120, rotateX: -15, pointerEvents: "none" }
          };
        case 3:
          return {
            init: { autoAlpha: 0, scale: 0.4, z: -500, pointerEvents: "none" },
            mid: { autoAlpha: 1, scale: 1, z: 0, pointerEvents: "auto" },
            exit: { autoAlpha: 0, scale: 1.3, z: 200, pointerEvents: "none" }
          };
        case 4:
          return {
            init: { autoAlpha: 0, rotateY: -50, rotateX: 15, pointerEvents: "none" },
            mid: { autoAlpha: 1, rotateY: 0, rotateX: 0, pointerEvents: "auto" },
            exit: { autoAlpha: 0, rotateY: 50, rotateX: -15, pointerEvents: "none" }
          };
        case 5:
          return {
            init: { autoAlpha: 0, scale: 0.2, pointerEvents: "none" },
            mid: { autoAlpha: 1, scale: 1, pointerEvents: "auto" },
            exit: { autoAlpha: 0, scale: 0.2, pointerEvents: "none" }
          };
        case 6:
          return {
            init: { autoAlpha: 0, x: 250, skewX: -8, pointerEvents: "none" },
            mid: { autoAlpha: 1, x: 0, skewX: 0, pointerEvents: "auto" },
            exit: { autoAlpha: 0, x: -250, skewX: 8, pointerEvents: "none" }
          };
        case 7:
          return {
            init: { autoAlpha: 0, rotateZ: -90, scale: 0.6, pointerEvents: "none" },
            mid: { autoAlpha: 1, rotateZ: 0, scale: 1, pointerEvents: "auto" },
            exit: { autoAlpha: 0, rotateZ: 90, scale: 0.6, pointerEvents: "none" }
          };
        case 8:
          return {
            init: { autoAlpha: 0, scale: 1.3, z: 150, pointerEvents: "none" },
            mid: { autoAlpha: 1, scale: 1, z: 0, pointerEvents: "auto" },
            exit: { autoAlpha: 0, scale: 0.8, z: -150, pointerEvents: "none" }
          };
        case 9:
          return {
            init: { autoAlpha: 0, scale: 1.1, rotateY: 15, pointerEvents: "none" },
            mid: { autoAlpha: 1, scale: 1, rotateY: 0, pointerEvents: "auto" },
            exit: { autoAlpha: 0, scale: 0.9, rotateY: -15, pointerEvents: "none" }
          };
        case 10:
          return {
            init: { autoAlpha: 0, rotateY: -90, z: -300, pointerEvents: "none" },
            mid: { autoAlpha: 1, rotateY: 0, z: 0, pointerEvents: "auto" },
            exit: { autoAlpha: 0, rotateY: 90, z: 300, pointerEvents: "none" }
          };
        case 11:
          return {
            init: { autoAlpha: 0, y: 100, pointerEvents: "none" },
            mid: { autoAlpha: 1, y: 0, pointerEvents: "auto" },
            exit: { autoAlpha: 0, y: -100, pointerEvents: "none" }
          };
        default:
          return {
            init: { autoAlpha: 0, pointerEvents: "none" },
            mid: { autoAlpha: 1, pointerEvents: "auto" },
            exit: { autoAlpha: 0, pointerEvents: "none" }
          };
      }
    }

    window.getSceneProps = getSceneProps;

    function initCardAnimations() {
      const cards = gsap.utils.toArray(".scene-card");
      cards.forEach((card, i) => {
        const props = getSceneProps(i);
        if (props) gsap.set(card, props.init);
      });
      if (typeof window.registerCards === "function") {
        window.registerCards(cards);
      }
    }
  </script>

  <!-- Script esterni e Chatbot -->
  <script src="public/cookie-banner.js"></script>
  <script src="public/chatbot.js"></script>
</body>
</html>
