<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RM Studio • Quick Share</title>
  <meta name="theme-color" content="#09090b">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #09090b;
      color: #f4f4f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #fff; }
    p { font-size: 14px; color: #a1a1aa; margin-bottom: 24px; }
    
    label { font-size: 13px; font-weight: 600; color: #d4d4d8; display: block; margin-bottom: 8px; }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .prefix {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 14px;
      color: #a1a1aa;
      font-weight: 600;
      font-size: 16px;
    }
    input {
      flex: 1;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 14px;
      font-size: 18px;
      color: #fff;
      outline: none;
    }
    input:focus { border-color: #22c55e; }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-wa {
      background: #22c55e;
      color: #000;
      margin-bottom: 12px;
    }
    .btn-share {
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
    }
    .divider {
      text-align: center;
      margin: 16px 0;
      font-size: 12px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Invia vCard RM Studio</h1>
    <p>Condivisione istantanea su WhatsApp</p>

    <!-- METODO 1: Se ti dà il numero al volo -->
    <label for="phone">Numero del cliente (senza salvare in rubrica):</label>
    <div class="input-group">
      <span class="prefix">+39</span>
      <input type="tel" id="phone" placeholder="3401234567" inputmode="numeric">
    </div>

    <button class="btn btn-wa" onclick="sendDirect()">
      💬 Apri Chat e Invia Dati
    </button>

    <div class="divider">oppure</div>

    <!-- METODO 2: Seleziona dalla lista WhatsApp -->
    <button class="btn btn-share" onclick="sendToPicker()">
      📲 Scegli Contatto da WhatsApp
    </button>
  </div>

  <script>
    // Testo del messaggio WhatsApp già formattato
    const message = `Piacere di averti conosciuto!
Sono Riccardo Modena di RM Studio.

Ecco i miei riferimenti:
📇 Salva Contatto in Rubrica:
https://rmstudio.app/contact.vcf

🌐 Sito Web:
https://rmstudio.app/

A presto!`;

    // 1. Invia direttamente al numero digitato
    function sendDirect() {
      let num = document.getElementById('phone').value.trim().replace(/\D/g, '');
      if (!num) {
        alert('Inserisci il numero di telefono');
        return;
      }
      if (!num.startsWith('39') && num.length <= 10) {
        num = '39' + num;
      }
      const url = `https://wa.me/${num}?text=${encodeURIComponent(message)}`;
      window.location.href = url;
    }

    // 2. Apre WhatsApp mostrando la lista dei contatti/recenti
    function sendToPicker() {
      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
      window.location.href = url;
    }
  </script>
</body>
</html>
